[workspace]
name = "mojo-manual"
version = "0.1.0"
description = "My notes and exercises while studying the Mojo 1.2.0 manual"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "1.2.*"     # pinned: the study guide was verified on 1.2.0
python = "3.12.*"  # Part 8: Python interop
numpy = "*"        # Part 8: calling NumPy from Mojo

[tasks]
version = "mojo --version"
# Run any file:   pixi run mojo run part01_basics/s01_hello.mojo
# Build a binary: pixi run mojo build part01_basics/s01_hello.mojo -o build/hello
